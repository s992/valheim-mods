name: Build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  # Reused by release.yml
  workflow_call:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  # Valheim Dedicated Server: anonymous download that ships the same managed assemblies as the client
  VALHEIM_SERVER_APP_ID: "896660"

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x

      - name: Look up Valheim server build
        id: valheim
        run: |
          buildid=$(curl -fsSL "https://api.steamcmd.net/v1/info/${VALHEIM_SERVER_APP_ID}" \
            | jq -r --arg app "$VALHEIM_SERVER_APP_ID" '.data[$app].depots.branches.public.buildid')
          if [[ ! "$buildid" =~ ^[0-9]+$ ]]; then
            echo "::error::Could not determine the Valheim server build id (got '$buildid')"
            exit 1
          fi
          echo "Valheim server build: $buildid"
          echo "buildid=$buildid" >> "$GITHUB_OUTPUT"

      # Only the Managed folder is cached; it's refreshed whenever the game updates
      - name: Cache game assemblies
        id: cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: valheim-managed
          key: valheim-managed-${{ steps.valheim.outputs.buildid }}

      - name: Download Valheim dedicated server
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq lib32gcc-s1
          mkdir -p steamcmd
          curl -fsSL https://steamcdn-a.akamaihd.net/client/installer/steamcmd_linux.tar.gz | tar -xz -C steamcmd

          # On a fresh steamcmd the first app_update usually fails with "Missing configuration"
          # and the next one succeeds. Exit codes are unreliable too, so check for the files and retry.
          managed="$PWD/valheim-server/valheim_server_Data/Managed"
          for attempt in 1 2 3; do
            ./steamcmd/steamcmd.sh +force_install_dir "$PWD/valheim-server" +login anonymous \
              +app_update "$VALHEIM_SERVER_APP_ID" validate +quit || true
            [[ -f "$managed/assembly_valheim.dll" ]] && break
            echo "Attempt $attempt did not produce assembly_valheim.dll; retrying"
          done
          [[ -f "$managed/assembly_valheim.dll" ]] || { echo "::error::Valheim server download failed"; exit 1; }

          cp -r "$managed" valheim-managed

      # Builds every mod in ValheimMods.sln. Warnings fail the build (Directory.Build.props)
      - name: Build
        run: dotnet build ValheimMods.sln -c Release -p:ValheimManagedDir="$GITHUB_WORKSPACE/valheim-managed"

      # Code style and analyzer rules from .editorconfig; fix locally with `dotnet format ValheimMods.sln`.
      # dotnet format takes no -p, so the game path goes in as an environment variable
      - name: Check formatting
        env:
          ValheimManagedDir: ${{ github.workspace }}/valheim-managed
        run: dotnet format ValheimMods.sln --verify-no-changes --no-restore

      # Stored relative to mods/, so downloading into mods/ restores each <Name>/bin/... path
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plugins
          path: mods/*/bin/Release/netstandard2.1/*.dll
          if-no-files-found: error
