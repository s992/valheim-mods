name: Build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
    inputs:
      with-mods:
        description: "Thunderstore packages (Namespace-Name, space-separated) to boot alongside, latest versions"
        required: false
        default: ""
  # Reused by release.yml and game-check.yml
  workflow_call:
    inputs:
      with-mods:
        type: string
        required: false
        default: ""

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  # Valheim Dedicated Server: anonymous download that ships the same managed assemblies as the client
  VALHEIM_SERVER_APP_ID: "896660"
  # The boot test's BepInEx; bump it when players' mod managers move to a new pack
  BEPINEX_PACK_VERSION: "5.4.2360"

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Pull requests need their commits' history for the commit rules check. The 0 is a string because
          # a number 0 is falsy in expressions and `&& 0 || 1` would always give 1
          fetch-depth: ${{ github.event_name == 'pull_request' && '0' || '1' }}

      # One mod per commit, and no AI-authored README edits (tools/check_commits.py)
      - name: Check commit rules
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: python3 tools/check_commits.py "$BASE" "$HEAD"

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x

      - name: Look up Valheim server build
        id: valheim
        run: |
          buildid=$(curl -fsSL "https://api.steamcmd.net/v1/info/${VALHEIM_SERVER_APP_ID}" \
            | jq -r --arg app "$VALHEIM_SERVER_APP_ID" '.data[$app].depots.branches.public.buildid')
          if [[ ! "$buildid" =~ ^[0-9]+$ ]]; then
            echo "::error::Could not determine the Valheim server build id (got '$buildid')"
            exit 1
          fi
          echo "Valheim server build: $buildid"
          echo "buildid=$buildid" >> "$GITHUB_OUTPUT"

      # The whole server (~2 GB) is cached, since the boot test runs it; refreshed whenever the game updates.
      # Saved right after the download, before the boot test adds BepInEx to it.
      - name: Restore Valheim server
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: valheim-server
          key: valheim-server-${{ steps.valheim.outputs.buildid }}

      - name: Download Valheim dedicated server
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq lib32gcc-s1
          mkdir -p steamcmd
          curl -fsSL https://steamcdn-a.akamaihd.net/client/installer/steamcmd_linux.tar.gz | tar -xz -C steamcmd

          # On a fresh steamcmd the first app_update usually fails with "Missing configuration"
          # and the next one succeeds. Exit codes are unreliable too, so check for the files and retry.
          managed="$PWD/valheim-server/valheim_server_Data/Managed"
          for attempt in 1 2 3; do
            ./steamcmd/steamcmd.sh +force_install_dir "$PWD/valheim-server" +login anonymous \
              +app_update "$VALHEIM_SERVER_APP_ID" validate +quit || true
            [[ -f "$managed/assembly_valheim.dll" ]] && break
            echo "Attempt $attempt did not produce assembly_valheim.dll; retrying"
          done
          [[ -f "$managed/assembly_valheim.dll" ]] || { echo "::error::Valheim server download failed"; exit 1; }

      - name: Save Valheim server
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: valheim-server
          key: valheim-server-${{ steps.valheim.outputs.buildid }}

      # Builds every mod in ValheimMods.sln. Warnings fail the build (Directory.Build.props)
      - name: Build
        run: dotnet build ValheimMods.sln -c Release -p:ValheimManagedDir="$GITHUB_WORKSPACE/valheim-server/valheim_server_Data/Managed"

      # tests/: logic that doesn't need a running game, against this game build's assemblies
      - name: Unit tests
        run: dotnet test ValheimMods.sln -c Release --no-build

      # Code style and analyzer rules from .editorconfig; fix locally with `dotnet format ValheimMods.sln`.
      # dotnet format takes no -p, so the game path goes in as an environment variable
      - name: Check formatting
        env:
          ValheimManagedDir: ${{ github.workspace }}/valheim-server/valheim_server_Data/Managed
        run: dotnet format ValheimMods.sln --verify-no-changes --no-restore

      # Starts the server with BepInEx and every mod: patches must apply and nothing may log an error
      - name: Boot test
        env:
          WITH_MODS: ${{ inputs.with-mods }}
        run: |
          # shellcheck disable=SC2086 # WITH_MODS is a space-separated list
          python3 tools/boot_test.py --server valheim-server --mods mods --bepinex "$BEPINEX_PACK_VERSION" \
            ${WITH_MODS:+--with $WITH_MODS}

      # Stored relative to mods/, so downloading into mods/ restores each <Name>/bin/... path
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plugins
          path: mods/*/bin/Release/netstandard2.1/*.dll
          if-no-files-found: error
