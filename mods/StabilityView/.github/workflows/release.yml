name: Release

# Push a tag matching <Version> in StabilityView.csproj (e.g. v1.2.0) to release.
# Running it manually builds the Thunderstore package as an artifact without releasing anything.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  # tcli targets net6/net7; let it run on the .NET 8 runtime
  DOTNET_ROLL_FORWARD: Major
  TCLI_VERSION: "0.2.4"

jobs:
  build:
    uses: ./.github/workflows/build.yml

  package:
    needs: build
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      file: ${{ steps.package.outputs.file }}
    steps:
      - uses: actions/checkout@v7

      - name: Read version
        id: version
        run: |
          version=$(grep -oP '(?<=<Version>)[^<]+' src/StabilityView/StabilityView.csproj)
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::<Version> '$version' in StabilityView.csproj is not Major.Minor.Patch"
            exit 1
          fi
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match <Version> $version in StabilityView.csproj"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check README
        run: |
          if [[ ! -f README.md ]]; then
            echo "::error::README.md is required for the Thunderstore package"
            exit 1
          fi

      - uses: actions/download-artifact@v8
        with:
          name: StabilityView
          path: src/StabilityView/bin/Release/netstandard2.1

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Build Thunderstore package
        id: package
        run: |
          dotnet tool install -g tcli --version "$TCLI_VERSION"
          tcli build --package-version "${{ steps.version.outputs.version }}"
          echo "file=s992-StabilityView-${{ steps.version.outputs.version }}.zip" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: thunderstore-package
          path: build/${{ steps.package.outputs.file }}
          if-no-files-found: error

  # Separate jobs so a failure in one can be re-run without repeating the other

  github-release:
    needs: package
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: thunderstore-package

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists"
          else
            gh release create "$GITHUB_REF_NAME" "${{ needs.package.outputs.file }}" \
              -R "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
          fi

  thunderstore:
    needs: package
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    steps:
      # tcli publish reads thunderstore.toml for the repository, community and categories
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: thunderstore-package

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Publish to Thunderstore
        env:
          TCLI_AUTH_TOKEN: ${{ secrets.THUNDERSTORE_TOKEN }}
        run: |
          if [[ -z "$TCLI_AUTH_TOKEN" ]]; then
            echo "::error::The THUNDERSTORE_TOKEN secret is not set"
            exit 1
          fi
          dotnet tool install -g tcli --version "$TCLI_VERSION"
          tcli publish --file "${{ needs.package.outputs.file }}"
