[config]
schemaVersion = "0.0.1"

[package]
namespace = "s992"
name = "MarkerCommand"
# Placeholder: release builds pass --package-version from <Version> in MarkerCommand.csproj
versionNumber = "0.0.0"
description = "Console command for adding map markers at coordinates or your current position, with optional names and icons."
websiteUrl = "https://github.com/s992/ValheimMarkerCommand"
containsNsfwContent = false

[package.dependencies]
denikson-BepInExPack_Valheim = "5.4.2351"

[build]
icon = "./icon.png"
readme = "./README.md"
outdir = "./build"

[[build.copy]]
source = "./src/MarkerCommand/bin/Release/netstandard2.1/MarkerCommand.dll"
target = "plugins/MarkerCommand.dll"

[publish]
repository = "https://thunderstore.io"
communities = ["valheim"]

[publish.categories]
valheim = ["tools", "client-side"]
