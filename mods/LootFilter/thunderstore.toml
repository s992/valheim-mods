[config]
schemaVersion = "0.0.1"

[package]
namespace = "s992"
name = "LootFilter"
# Placeholder: release builds pass --package-version from <Version> in LootFilter.csproj
versionNumber = "0.0.0"
description = "Loot filter: mark items or item groups as junk so they are not auto-picked up and lose their sparkles. Mark items while hovering them."
websiteUrl = "https://github.com/s992/valheim-mods/tree/main/mods/LootFilter"
containsNsfwContent = false

[package.dependencies]
denikson-BepInExPack_Valheim = "5.4.2351"

[build]
icon = "./icon.png"
readme = "./README.md"
outdir = "./build"

[[build.copy]]
source = "./bin/Release/netstandard2.1/LootFilter.dll"
target = "plugins/LootFilter.dll"

# tcli has no changelog setting; Thunderstore shows a CHANGELOG.md from the package root
[[build.copy]]
source = "./CHANGELOG.md"
target = "CHANGELOG.md"

[publish]
repository = "https://thunderstore.io"
communities = ["valheim"]

[publish.categories]
valheim = ["ai-generated", "tools", "client-side"]
