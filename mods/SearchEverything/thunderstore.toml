[config]
schemaVersion = "0.0.1"

[package]
namespace = "s992"
name = "SearchEverything"
# Placeholder: release builds pass --package-version from <Version> in SearchEverything.csproj
versionNumber = "0.0.0"
description = "Search crafting recipes and chests, and find items in nearby chests with a quick-search window that marks where they are."
websiteUrl = "https://github.com/s992/valheim-mods/tree/main/mods/SearchEverything"
containsNsfwContent = false

[package.dependencies]
denikson-BepInExPack_Valheim = "5.4.2351"

[build]
icon = "./icon.png"
readme = "./README.md"
outdir = "./build"

[[build.copy]]
source = "./bin/Release/netstandard2.1/SearchEverything.dll"
target = "plugins/SearchEverything.dll"

# tcli has no changelog setting; Thunderstore shows a CHANGELOG.md from the package root
[[build.copy]]
source = "./CHANGELOG.md"
target = "CHANGELOG.md"

[publish]
repository = "https://thunderstore.io"
communities = ["valheim"]

[publish.categories]
valheim = ["ai-generated", "tools", "client-side"]
