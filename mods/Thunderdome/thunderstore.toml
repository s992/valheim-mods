[config]
schemaVersion = "0.0.1"

[package]
namespace = "s992"
name = "Thunderdome"
# Placeholder: release builds pass --package-version from <Version> in Thunderdome.csproj
versionNumber = "0.0.0"
description = "A buildable ward whose dome strikes down monsters with lightning, or keeps them out the way the traders' force fields do. Server-synced mode and radius, shown while placing. Needs Jotunn."
websiteUrl = "https://github.com/s992/valheim-mods/tree/main/mods/Thunderdome"
containsNsfwContent = false

[package.dependencies]
denikson-BepInExPack_Valheim = "5.4.2351"
ValheimModding-Jotunn = "2.30.2"

[build]
icon = "./icon.png"
readme = "./README.md"
outdir = "./build"

[[build.copy]]
source = "./bin/Release/netstandard2.1/Thunderdome.dll"
target = "plugins/Thunderdome.dll"

# tcli has no changelog setting; Thunderstore shows a CHANGELOG.md from the package root
[[build.copy]]
source = "./CHANGELOG.md"
target = "CHANGELOG.md"

[publish]
repository = "https://thunderstore.io"
communities = ["valheim"]

[publish.categories]
valheim = ["ai-generated", "misc", "server-side", "client-side"]
