[config]
schemaVersion = "0.0.1"

[package]
namespace = "s992"
name = "CraftFromStorage"
# Placeholder: release builds pass --package-version from <Version> in CraftFromStorage.csproj
versionNumber = "0.0.0"
description = "Craft, build and smelt with materials from nearby chests. Built on Multi User Chest for multiplayer; works with Quick Stack Store Sort Trash Restock and Epic Loot."
websiteUrl = "https://github.com/s992/valheim-mods/tree/main/mods/CraftFromStorage"
containsNsfwContent = false

[package.dependencies]
denikson-BepInExPack_Valheim = "5.4.2351"

[build]
icon = "./icon.png"
readme = "./README.md"
outdir = "./build"

[[build.copy]]
source = "./bin/Release/netstandard2.1/CraftFromStorage.dll"
target = "plugins/CraftFromStorage.dll"

[publish]
repository = "https://thunderstore.io"
communities = ["valheim"]

[publish.categories]
valheim = ["ai-generated", "tools", "crafting"]
